<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Parallel background and direction evidence channels</title>
  <desc id="description">Candidate and membership evidence are compared in parallel background and direction channels using cosine similarity. The two resulting scores receive equal weight and combine into the final membership score.</desc>
  <style>
    :root {
      --panel: #f6f8fa;
      --node: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #8c959f;
      --line: #57606a;
      --background-accent: #0969da;
      --direction-accent: #8250df;
      --final-accent: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --panel: #161b22;
        --node: #0d1117;
        --text: #f0f6fc;
        --muted: #9198a1;
        --border: #6e7681;
        --line: #8b949e;
        --background-accent: #58a6ff;
        --direction-accent: #bc8cff;
        --final-accent: #3fb950;
      }
    }
    text {
      fill: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .node { fill: var(--node); stroke: var(--border); stroke-width: 1.5; }
    .channel-title { font-size: 24px; font-weight: 700; letter-spacing: 0.4px; }
    .section-title { font-size: 16px; font-weight: 700; }
    .field { fill: var(--muted); }
    .function { fill: var(--node); stroke-width: 2.5; }
    .function-label { font-size: 17px; font-weight: 700; }
    .output-label { font-size: 16px; font-weight: 700; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#arrowhead); }
    .weight { fill: var(--muted); font-size: 15px; font-weight: 700; }
    .final-box { fill: var(--node); stroke: var(--final-accent); stroke-width: 3; }
    .final-title { font-size: 22px; font-weight: 700; }
    .formula { font-size: 18px; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--line)"/>
    </marker>
  </defs>

  <rect class="panel" x="30" y="30" width="550" height="530" rx="14"/>
  <rect class="panel" x="620" y="30" width="550" height="530" rx="14"/>

  <text class="channel-title" x="305" y="72" text-anchor="middle" fill="var(--background-accent)">BACKGROUND:</text>
  <text class="channel-title" x="895" y="72" text-anchor="middle" fill="var(--direction-accent)">DIRECTION:</text>

  <rect class="node" x="55" y="100" width="205" height="175" rx="10"/>
  <text x="75" y="130">
    <tspan class="section-title" x="75" dy="0">candidate_background:</tspan>
    <tspan class="field" x="75" dy="32">• current_job_title</tspan>
    <tspan class="field" x="75" dy="27">• skills</tspan>
    <tspan class="field" x="75" dy="27">• experience_narrative</tspan>
  </text>

  <rect class="node" x="280" y="100" width="275" height="175" rx="10"/>
  <text x="300" y="130">
    <tspan class="section-title" x="300" dy="0">membership_background_target:</tspan>
    <tspan class="field" x="300" dy="30">• ESCO occupation description</tspan>
    <tspan class="field" x="300" dy="25">• Role Profile core task areas</tspan>
    <tspan class="field" x="300" dy="25">• candidate-evidence standards</tspan>
    <tspan class="field" x="300" dy="25">• reviewed membership skill labels</tspan>
  </text>

  <rect class="node" x="645" y="100" width="205" height="175" rx="10"/>
  <text x="665" y="130">
    <tspan class="section-title" x="665" dy="0">candidate_direction:</tspan>
    <tspan class="field" x="665" dy="32">• desired_work_directions</tspan>
  </text>

  <rect class="node" x="870" y="100" width="275" height="175" rx="10"/>
  <text x="890" y="130">
    <tspan class="section-title" x="890" dy="0">membership_direction_target:</tspan>
    <tspan class="field" x="890" dy="30">• Role Profile names + purpose</tspan>
    <tspan class="field" x="890" dy="25">• typical work directions</tspan>
    <tspan class="field" x="890" dy="25">• natural direction descriptions</tspan>
    <tspan class="field" x="890" dy="25">• preferred + alternative titles</tspan>
  </text>

  <path class="arrow" d="M158 275 V300 H235 V325"/>
  <path class="arrow" d="M418 275 V300 H375 V325"/>
  <rect class="function" x="150" y="325" width="310" height="78" rx="10" stroke="var(--background-accent)"/>
  <text x="305" y="371" text-anchor="middle">
    <tspan class="function-label" x="305" dy="0">cosine_similarity():</tspan>
  </text>
  <path class="arrow" d="M305 403 V438"/>
  <rect class="node" x="190" y="438" width="230" height="66" rx="10"/>
  <text x="305" y="466" text-anchor="middle">
    <tspan class="section-title" x="305" dy="0">Output:</tspan>
    <tspan class="output-label" x="305" dy="25">background_score</tspan>
  </text>

  <path class="arrow" d="M748 275 V300 H825 V325"/>
  <path class="arrow" d="M1008 275 V300 H965 V325"/>
  <rect class="function" x="740" y="325" width="310" height="78" rx="10" stroke="var(--direction-accent)"/>
  <text x="895" y="371" text-anchor="middle">
    <tspan class="function-label" x="895" dy="0">cosine_similarity():</tspan>
  </text>
  <path class="arrow" d="M895 403 V438"/>
  <rect class="node" x="780" y="438" width="230" height="66" rx="10"/>
  <text x="895" y="466" text-anchor="middle">
    <tspan class="section-title" x="895" dy="0">Output:</tspan>
    <tspan class="output-label" x="895" dy="25">direction_score</tspan>
  </text>

  <path class="arrow" d="M305 504 C305 590 455 610 520 670"/>
  <path class="arrow" d="M895 504 C895 590 745 610 680 670"/>
  <text class="weight" x="430" y="596" text-anchor="middle">× 0.5</text>
  <text class="weight" x="770" y="596" text-anchor="middle">× 0.5</text>

  <rect class="final-box" x="375" y="670" width="450" height="110" rx="12"/>
  <text x="600" y="711" text-anchor="middle">
    <tspan class="final-title" x="600" dy="0">FINAL MEMBERSHIP SCORE:</tspan>
    <tspan class="formula" x="600" dy="36">membership_score = 0.5 × background_score</tspan>
    <tspan class="formula" x="600" dy="27">+ 0.5 × direction_score</tspan>
  </text>
</svg>
